    .mushroom-wallet{border:1px solid #ffe0b2;background:linear-gradient(135deg,#fff,#fff8ed)}
    .mini-wallet small{display:block;font-size:11px;color:#666;margin-bottom:2px}
    .mini-wallet strong{display:block;font-size:18px;color:#222}
    .wallet-withdraw-btn{width:100%;margin-top:9px;padding:8px 5px;border:0;border-radius:10px;background:#2e7d32;color:#fff;font-size:10px;font-weight:800;transition:transform .2s}
    .wallet-withdraw-btn:active{transform:scale(.95)}.mushroom-btn{background:#ff8f00}
    .quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;background:#fff;padding:15px 10px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.05)}

    .quick p{font-size:11px;font-weight:600;color:#444}
    .quick-image{width:55px;height:55px;object-fit:contain;display:block;margin:0 auto 6px;border-radius:14px;transition:transform .25s}
    .quick-image.verify{width:60px;height:60px}.quick-image.scratch,.quick-image.refer{width:58px;height:58px}
    .quick:active .quick-image{transform:scale(.94)}
    .modal-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9999;padding:15px;backdrop-filter:blur(2px)}
    .modal-overlay.active{display:flex}
    .modal-content{background:#fff;width:100%;max-width:360px;border-radius:20px;padding:20px;position:relative;text-align:center;box-shadow:0 10px 25px rgba(0,0,0,.2)}
    .close-modal{position:absolute;top:12px;right:15px;font-size:22px;background:none;color:#888}
    .verify-input{width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font-size:13px}
    .primary-btn{width:100%;padding:12px;background:#2e7d32;color:#fff;font-weight:700;border-radius:10px;margin-top:10px;font-size:14px}

    .wheel-wrapper{position:relative;width:240px;height:240px;margin:15px auto}
    #spinCanvas{width:240px;height:240px;border-radius:50%;box-shadow:0 4px 10px rgba(0,0,0,.15)}
    .wheel-pointer{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:20px solid #d32f2f;z-index:10}
    .scratch-wrapper{position:relative;width:220px;height:140px;margin:15px auto;border-radius:12px;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.1)}
    .scratch-background{position:absolute;top:0;left:0;width:100%;height:100%;background:#e8f5e9;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#2e7d32;font-weight:700}

    #toast{position:fixed;bottom:75px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.88);color:#fff;padding:10px 20px;border-radius:25px;font-size:12px;display:none;z-index:100000;text-align:center;max-width:90%}
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#fff;display:flex;justify-content:space-around;padding:10px 0;box-shadow:0 -2px 10px rgba(0,0,0,.05);border-top:1px solid #eee;z-index:999}
    .nav-item{background:none;display:flex;flex-direction:column;align-items:center;font-size:10px;color:#666}

      "92XG","38YH","56ZI","24AJ","69BK","83CL","17DM","45EN","78FO","31GP","64HQ","86IR","29JS","57KT","93LU","42MV","75NW","18OX","61PY","84QZ","35RA","72SB","49TC","96UD","27VE","53WF","81XG","16YH","68ZI","43AJ","95BK","37CL","62DM","89EN","14FO","76GP","51HQ","28IR","63JS","85KT",

    let mushroomWallet = 450;
    let isSpinning = false, isScratchClaimed = false, currentScratchReward = null;

    // ==========================================
    // ONE-TIME REWARD CODE SYSTEM
    // Apps Script / Backend NOT REQUIRED
    // ==========================================
    const USED_CODES_KEY = "KUNDU_USED_REWARD_CODES_V1";
    const ACTIVE_CODE_KEY = "KUNDU_ACTIVE_REWARD_CODE_V1";
    const ACTIVE_TYPE_KEY = "KUNDU_ACTIVE_REWARD_TYPE_V1";

    function getUsedCodes() {
      try {
        const data = localStorage.getItem(USED_CODES_KEY);
        return data ? JSON.parse(data) : [];
      } catch (e) {
        return [];
      }
    }

    function saveUsedCodes(codes) {
      localStorage.setItem(USED_CODES_KEY, JSON.stringify([...new Set(codes)]));
    }

    function isCodeUsed(code) {
      return getUsedCodes().includes(code);
    }

    function markCodeUsed(code) {
      const used = getUsedCodes();
      if (!used.includes(code)) {
        used.push(code);
        saveUsedCodes(used);
      }
      localStorage.removeItem(ACTIVE_CODE_KEY);
      localStorage.removeItem(ACTIVE_TYPE_KEY);
    }

    function getActiveRewardType() { return localStorage.getItem(ACTIVE_TYPE_KEY); }

    function setActiveRewardType(type) { localStorage.setItem(ACTIVE_TYPE_KEY, type); }

      localStorage.removeItem(ACTIVE_CODE_KEY);
      localStorage.removeItem(ACTIVE_TYPE_KEY);
    }

    const closeModal = id => document.getElementById(id).classList.remove("active");
    const closeAllModals = () => document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.innerText = msg; t.style.display = "block";
      setTimeout(() => { t.style.display = "none"; }, 3000);
    }

    // Audio Engine
    const clapAudio = document.getElementById("clapSound");
    const moneyAudio = document.getElementById("rewardMoneySound");
    const withdrawAudio = document.getElementById("withdrawMoneySound");

    function unlockAudio() {
      [clapAudio, moneyAudio, withdrawAudio].forEach(a => {
        a.muted = true; a.play().then(() => { a.pause(); a.currentTime = 0; a.muted = false; }).catch(()=>{});
      });
    }
    document.addEventListener("touchstart", unlockAudio, { once: true });
    document.addEventListener("click", unlockAudio, { once: true });

    async function playRewardSoundSequence() {
      try {
        clapAudio.currentTime = 0; await clapAudio.play();
        setTimeout(async () => { moneyAudio.currentTime = 0; await moneyAudio.play(); }, 1000);
      } catch (e) {}
    }

    function launchConfetti() {
      for (let i = 0; i < 50; i++) {
        const c = document.createElement("div");
        c.innerHTML = ["🎉","✨","💰","🍄"][Math.floor(Math.random()*4)];
        c.style.cssText = `position:fixed;left:${Math.random()*100}vw;top:-20px;font-size:${14+Math.random()*14}px;z-index:99999;pointer-events:none;transition:transform 2s linear, opacity 2s;`;
        document.body.appendChild(c);
        setTimeout(() => {
          c.style.transform = `translate(${(Math.random()-.5)*200}px, ${window.innerHeight+50}px) rotate(360deg)`;
          c.style.opacity = "0";
        }, 20);
        setTimeout(() => c.remove(), 2200);
      }
    }

    function addRewardToWallet(reward) {
      if (!reward) return;
      if (reward.type === "cash") {
        wallet += Number(reward.amount);
        document.getElementById("cashWalletBalance").innerText = wallet.toFixed(2);
        showToast(`💰 ₹${reward.amount} Cash Wallet-এ জমা হয়েছে`);

        mushroomWallet += Number(reward.amount);
        document.getElementById("mushroomWalletBalance").innerText = mushroomWallet;
        showToast(`🍄 ${reward.amount} Mushroom Wallet-এ জমা হয়েছে`);
      }

    async function verifyRewardCode() {
      const codeInput = document.getElementById("rewardCodeInput");
      const code = codeInput.value.trim().toUpperCase();

      if (!code) {
        showToast("⚠️ কুপন কোডটি লিখুন");
        return;
      }

      if (!VALID_REWARD_CODES.has(code)) {
        showToast("❌ Invalid Reward Code");
        return;
      }

      if (isCodeUsed(code)) {
        showToast("❌ এই Code ইতিমধ্যেই ব্যবহার করা হয়েছে");

        return;

      codeInput.value = "";

    }

    // Spin Handlers
    function openSpinModal() {
      const code = getActiveCode();

      if (!code) {
        showToast("🎫 আগে একটি Reward Code Verify করুন");
        openScannerModal();
        return;
      }

      if (isCodeUsed(code)) {
        clearActiveRewardSession();
        showToast("❌ এই Code ইতিমধ্যেই ব্যবহার হয়েছে");
        return;
      }

      setActiveRewardType("spin");
      openModal("spinModal");
      drawWheel();
    }

    let currentAngle = 0;
    function drawWheel() {
      const canvas = document.getElementById("spinCanvas"); if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const arc = (2 * Math.PI) / spinRewards.length;
      const colors = ["#2e7d32", "#ff8f00", "#43a047", "#ffa726", "#66bb6a", "#ffb74d"];
      ctx.clearRect(0,0,240,240);

      for (let i = 0; i < spinRewards.length; i++) {
        const angle = currentAngle + i * arc;
        ctx.beginPath(); ctx.fillStyle = colors[i];
        ctx.moveTo(120, 120); ctx.arc(120, 120, 115, angle, angle + arc); ctx.fill();
        ctx.save(); ctx.translate(120, 120); ctx.rotate(angle + arc / 2);
        ctx.textAlign = "right"; ctx.fillStyle = "#fff"; ctx.font = "bold 12px sans-serif";
        ctx.fillText(spinRewards[i].label, 100, 4); ctx.restore();
      }
    }

    function startSpin() {
      const code = getActiveCode();

      if (!code) {
        showToast("🎫 আগে Reward Code Verify করুন");
        closeModal("spinModal");
        openScannerModal();
        return;
      }

      if (isCodeUsed(code)) {
        showToast("❌ এই Code ইতিমধ্যেই ব্যবহার হয়েছে");
        closeModal("spinModal");
        clearActiveRewardSession();
        return;
      }

      const rewardType = getActiveRewardType();
      if (rewardType !== "spin") {
        showToast("⚠️ এই Code Spin-এর জন্য অনুমোদিত নয়");
        return;
      }

      if (isSpinning) return;
      isSpinning = true;

      const spinButton = document.getElementById("spinButton");
      spinButton.disabled = true;

      const winIdx = Math.floor(Math.random() * spinRewards.length);
      const arc = (2 * Math.PI) / spinRewards.length;
      const target = (3 * Math.PI / 2) - (winIdx * arc + arc / 2) + (8 * Math.PI * 2);

      let start = null;

      function animate(t) {
        if (!start) start = t;
        const progress = (t - start) / 3000;

        if (progress < 1) {
          currentAngle = (1 - Math.pow(1 - progress, 3)) * target;
          drawWheel();
          requestAnimationFrame(animate);
        } else {
          currentAngle = target;
          drawWheel();
          isSpinning = false;
          spinButton.disabled = false;

          const reward = spinRewards[winIdx];
          addRewardToWallet(reward);
          markCodeUsed(code);

          launchConfetti();
          playRewardSoundSequence();
          showToast(`🎉 ${reward.label} জিতেছেন!`);
          closeModal("spinModal");
        }
      }

      requestAnimationFrame(animate);
    }

    // Scratch Handlers
    function openScratchModal() {
      const code = getActiveCode();

      if (!code) {
        showToast("🎫 আগে একটি Reward Code Verify করুন");
        openScannerModal();
        return;
      }

      if (isCodeUsed(code)) {
        clearActiveRewardSession();
        showToast("❌ এই Code ইতিমধ্যেই ব্যবহার হয়েছে");
        return;
      }

      setActiveRewardType("scratch");
      openModal("scratchModal");
      initScratchCard();
    }

    function initScratchCard() {
      const canvas = document.getElementById("scratchCanvas"); if (!canvas) return;
      const ctx = canvas.getContext("2d");
      currentScratchReward = spinRewards[Math.floor(Math.random() * spinRewards.length)];
      document.getElementById("scratchPrizeText").innerText = currentScratchReward.label;
      document.getElementById("scratchClaimBtn").style.display = "none";
      isScratchClaimed = false;

      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "#b0bec5"; ctx.fillRect(0, 0, 220, 140);
      ctx.fillStyle = "#37474f"; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center";
      ctx.fillText("এখানে ঘষুন 🪙", 110, 75);

      let drawing = false;

      function scratch(e) {
        if (!drawing) return;

        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX ?? (e.touches && e.touches[0]?.clientX);
        const clientY = e.clientY ?? (e.touches && e.touches[0]?.clientY);

        if (clientX == null || clientY == null) return;

        const x = clientX - rect.left;
        const y = clientY - rect.top;

        ctx.globalCompositeOperation = "destination-out";
        ctx.beginPath();
        ctx.arc(x, y, 16, 0, Math.PI * 2);
        ctx.fill();

        // Check Scratch percentage (Minimum 40%)
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        let transparent = 0;

        for (let i = 3; i < imageData.data.length; i += 4) {
          if (imageData.data[i] === 0) {
            transparent++;
          }
        }

        const percentage = transparent / (canvas.width * canvas.height);

        if (percentage >= 0.40) {
          document.getElementById("scratchClaimBtn").style.display = "block";
        }
      }

      canvas.onmousedown = canvas.ontouchstart = () => drawing = true;
      canvas.onmouseup = canvas.ontouchend = () => drawing = false;
      canvas.onmousemove = canvas.ontouchmove = scratch;
    }

    function claimScratchReward() {
      if (isScratchClaimed) return;

      const code = getActiveCode();

      if (!code) {
        showToast("🎫 Reward Code পাওয়া যায়নি");
        closeModal("scratchModal");
        return;
      }

      if (isCodeUsed(code)) {
        showToast("❌ এই Code ইতিমধ্যেই ব্যবহার হয়েছে");
        closeModal("scratchModal");
        clearActiveRewardSession();
        return;
      }

      const rewardType = getActiveRewardType();
      if (rewardType !== "scratch") {
        showToast("⚠️ এই Code Scratch-এর জন্য অনুমোদিত নয়");
        return;
      }

      if (!currentScratchReward) {
        showToast("⚠️ Scratch Reward পাওয়া যায়নি");
        return;
      }

      isScratchClaimed = true;
      addRewardToWallet(currentScratchReward);
      markCodeUsed(code);

      launchConfetti();
      playRewardSoundSequence();
      showToast(`🎉 ${currentScratchReward.label} জিতেছেন!`);
      closeModal("scratchModal");
    }

    // Modals & Camera Triggers
    function openScannerModal() { openModal("scannerModal"); }
    function startRealScanner() {
      if (!navigator.mediaDevices?.getUserMedia) return showToast("⚠️ Camera support করছে না");
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(s => {
        showToast("📷 Camera চালু হয়েছে"); setTimeout(() => s.getTracks().forEach(t => t.stop()), 3000);
      }).catch(() => showToast("⚠️ Camera Permission দিন"));
    }

    function openReferralModal() { openModal("referralModal"); }
    function shareReferral() {
      const msg = "🍄 Kundu Care-এ Join করুন এবং Reward পান!";
      if (navigator.share) navigator.share({ title: "Kundu Care", text: msg });
      else { navigator.clipboard.writeText(msg); showToast("👥 Link কপি হয়েছে!"); }
    }

    function openCashWithdraw() {
      document.getElementById("cashWithdrawAmount").innerText = "₹" + wallet.toFixed(2);
      openModal("withdrawModal");
    }

    // Cash Withdraw API Integration
    async function confirmWithdraw(){
      const amount = Number(wallet || 0);

      if(amount <= 0){
        showToast("⚠️ Balance নেই");
        return;
  }const name = document.getElementById("withdrawName").value.trim();
      const phone = document.getElementById("withdrawPhone").value.trim();

      if(!name || !phone){
        showToast("নাম ও ফোন নম্বর দিন");
        return;
      }

      const btn = document.getElementById("withdrawConfirmBtn");
      btn.disabled = true;
      btn.innerText = "⏳ Processing...";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            secret: API_SECRET,
            action: "cashWithdraw",
            customerId: CUSTOMER_ID,
            name: name,
            phone: phone,
            amount: amount
          })
        });

        const data = await res.json();

        if(data.success){
          wallet = 0;
          document.getElementById("cashWalletBalance").innerText = "0.00";
          try { withdrawAudio.currentTime = 0; await withdrawAudio.play(); } catch(e){}
          showToast("✅ Withdraw Request পাঠানো হয়েছে");
          closeModal("withdrawModal");
        } else {
          showToast("❌ " + data.message);
        }
      } catch(e) {
        console.error(e);
        showToast("❌ Server Error");
      } finally {
        btn.disabled = false;
        btn.innerText = "💸 CONFIRM WITHDRAW";
      }
    }

    // Mushroom Withdraw WhatsApp Integration
    function openMushroomWithdraw() {
      document.getElementById("mushroomWithdrawAmount").innerText = mushroomWallet + " 🍄";
      openModal("mushroomWithdrawModal");

  </script>
